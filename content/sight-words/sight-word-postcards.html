<style>
  /* ── Single-theme design: parchment & saddle leather, painted explicitly ── */
  :root{
    --leather:#2b2015;        /* page ground */
    --frame:#3b2b1c;          /* card frame umber */
    --frame-hi:#54402a;
    --parchment:#f4e7c8;
    --parchment-deep:#e9d6a9;
    --ink:#4b3521;            /* embossed brown */
    --ink-deep:#372611;
    --bronze:#9c7340;
    --bronze-hi:#d9b672;
    --bronze-lo:#6e4d24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--leather);
    font-family:"Graduate", "Rockwell", serif;
    color:var(--parchment);
    padding:28px 24px 64px;
  }
  header.toolbar{
    max-width:1180px;margin:0 auto 26px;
    display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  }
  header.toolbar h1{font-size:26px;letter-spacing:.06em;font-weight:400;color:#e8d5a8}
  header.toolbar p{font-family:Georgia,serif;font-style:italic;font-size:14px;color:#b79b6e}
  header.toolbar button{
    margin-left:auto;font-family:"Graduate",serif;font-size:13px;letter-spacing:.08em;
    background:var(--bronze);color:#2b2015;border:none;border-radius:6px;
    padding:9px 18px;cursor:pointer;box-shadow:0 2px 0 var(--bronze-lo);
  }
  header.toolbar button:hover{background:var(--bronze-hi)}
  header.toolbar button:focus-visible{outline:3px solid var(--bronze-hi);outline-offset:2px}

  .deck{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:26px;
  }
  @media (max-width:480px){ .deck{grid-template-columns:1fr} }

  /* ───────────────────────── CARD ───────────────────────── */
  .card{container-type:inline-size;}
  .frame{
    position:relative;
    aspect-ratio:10/7;
    border-radius:5.2cqw;
    background:linear-gradient(178deg,var(--frame-hi) 0%,var(--frame) 22%,#33241a 100%);
    box-shadow:
      inset 0 .35cqw 0 rgba(255,230,180,.16),
      inset 0 -.4cqw .5cqw rgba(0,0,0,.45),
      0 .9cqw 1.8cqw rgba(0,0,0,.5);
    padding:2.6cqw;
  }
  .paper{
    position:absolute;inset:2.6cqw;
    border-radius:3.4cqw;
    background:
      var(--grain, none),
      radial-gradient(120% 120% at 50% 32%, #f8eed4 0%, var(--parchment) 45%, var(--parchment-deep) 100%);
    box-shadow:
      inset 0 .3cqw 1cqw rgba(59,43,28,.35),
      inset 0 -.25cqw .6cqw rgba(59,43,28,.25);
    overflow:hidden;
  }

  /* top row fixtures */
  .seal{position:absolute;top:5%;left:4.5%;width:24.5%;filter:drop-shadow(0 .4cqw .5cqw rgba(50,33,16,.45))}
  .fromblock{
    position:absolute;top:9.5%;left:31.5%;
    font-family:"Graduate",serif;color:var(--ink);
    text-shadow:0 -.14cqw 0 rgba(255,244,214,.55), 0 .3cqw .35cqw rgba(55,38,17,.38);
    line-height:1.28;letter-spacing:.045em;
    font-size:4.5cqw;
  }
  .fromblock .lbl{font-size:3.6cqw;display:block;letter-spacing:.1em}
  .postmark{position:absolute;top:9%;left:62.5%;width:13.5%;filter:drop-shadow(0 .25cqw .3cqw rgba(55,38,17,.35))}
  .stamp{position:absolute;top:6%;right:5%;width:17.5%;filter:drop-shadow(0 .4cqw .5cqw rgba(50,33,16,.45))}

  /* word plate */
  .plate{
    position:absolute;left:9.5%;right:9.5%;top:36%;bottom:9.5%;
    display:flex;align-items:center;justify-content:center;
  }
  .plate svg.plaque{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
    filter:drop-shadow(0 .3cqw .4cqw rgba(55,38,17,.3))}
  .word{
    position:relative;z-index:2;
    font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
    font-weight:800;color:var(--ink);
    letter-spacing:.01em;
    transform:translateY(-2%);
    text-shadow:
      0 -.22cqw 0 rgba(255,246,218,.5),
      0 .35cqw 0 var(--ink-deep),
      0 .8cqw .9cqw rgba(55,38,17,.4);
  }
  .w-s{font-size:22cqw}   /* 1–3 letters  */
  .w-m{font-size:17cqw}   /* 4–5 letters  */
  .w-l{font-size:13.5cqw} /* 6+ letters   */

  .shield{position:absolute;right:6.5%;bottom:6.5%;width:12.5%;z-index:3;
    filter:drop-shadow(0 .35cqw .45cqw rgba(50,33,16,.5))}

  /* ───────────────────────── PRINT ───────────────────────── */
  @media print{
    body{background:#fff;padding:0}
    header.toolbar{display:none}
    .deck{display:block;max-width:none}
    .card{width:7in;margin:0.35in auto;break-inside:avoid}
    .frame{box-shadow:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

/* subtle parchment grain, generated once */
(function grain(){
  const c=document.createElement("canvas");c.width=c.height=140;
  const x=c.getContext("2d"),d=x.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){
    const v=118+Math.random()*60|0;
    d.data[i]=v;d.data[i+1]=v*0.92|0;d.data[i+2]=v*0.75|0;d.data[i+3]=14;
  }
  x.putImageData(d,0,0);
  document.documentElement.style.setProperty("--grain",`url(${c.toDataURL()})`);
})();

/* western ticket plaque: rounded rect with concave corner scoops */
function plaquePath(W,H,m,j,r){
  const x0=m, y0=m, x1=W-m, y1=H-m;
  return `M ${x0+r+2*j} ${y0}
    H ${x1-r-2*j}
    a ${j} ${j} 0 0 0 ${j} ${j}  a ${r} ${r} 0 0 1 ${r} ${r}  a ${j} ${j} 0 0 0 ${j} ${j}
    V ${y1-r-2*j}
    a ${j} ${j} 0 0 0 -${j} ${j}  a ${r} ${r} 0 0 1 -${r} ${r}  a ${j} ${j} 0 0 0 -${j} ${j}
    H ${x0+r+2*j}
    a ${j} ${j} 0 0 0 -${j} -${j}  a ${r} ${r} 0 0 1 -${r} -${r}  a ${j} ${j} 0 0 0 -${j} -${j}
    V ${y0+r+2*j}
    a ${j} ${j} 0 0 0 ${j} -${j}  a ${r} ${r} 0 0 1 ${r} -${r}  a ${j} ${j} 0 0 0 ${j} -${j} Z`;
}
