<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Georgia, serif">

  <!-- Title bar -->
  <rect x="0" y="0" width="1000" height="70" fill="#4A2F1A"/>
  <text x="500" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#F5EDD8">
    WEEK 11 — HOME OBSTACLE COURSE
  </text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#D4B896" font-style="italic">
    Tribal Cowboy · Trail + Neck Rein Curriculum · Suggested 80' × 60' Arena Layout
  </text>

  <!-- Arena background -->
  <rect x="50" y="90" width="900" height="540" fill="#F5EDD8" stroke="#4A2F1A" stroke-width="5" rx="6"/>

  <!-- Compass / scale -->
  <g transform="translate(70, 110)">
    <text x="0" y="0" font-size="11" fill="#6B4423" font-weight="bold">SCALE</text>
    <line x1="0" y1="8" x2="56" y2="8" stroke="#4A2F1A" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="11" stroke="#4A2F1A" stroke-width="2"/>
    <line x1="56" y1="5" x2="56" y2="11" stroke="#4A2F1A" stroke-width="2"/>
    <text x="0" y="22" font-size="10" fill="#6B4423">= 5 feet</text>
  </g>

  <!-- ============= STATION 1: WALK OVER 3 GROUND POLES ============= -->
  <!-- pole spacing: 4 feet apart -->
  <g transform="translate(150, 160)">
    <!-- pole 1 -->
    <rect x="0" y="0" width="100" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- pole 2 -->
    <rect x="0" y="44" width="100" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- pole 3 -->
    <rect x="0" y="88" width="100" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- label -->
    <circle cx="-25" cy="49" r="18" fill="#4A2F1A"/>
    <text x="-25" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">1</text>
    <text x="50" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">WALK-OVER POLES</text>
    <text x="115" y="20" font-size="11" fill="#6B4423">3 poles</text>
    <text x="115" y="34" font-size="11" fill="#6B4423">10' long</text>
    <text x="115" y="48" font-size="11" fill="#6B4423">4' apart</text>
  </g>

  <!-- Path 1→2 -->
  <path d="M 270 215 Q 350 215 380 215" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 2: SIDE-PASS OVER POLE ============= -->
  <g transform="translate(400, 160)">
    <!-- horizontal pole on the ground -->
    <rect x="0" y="40" width="120" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- horse approach indicator (arrow from above pole going across) -->
    <path d="M 60 10 L 60 35" stroke="#7A8A5E" stroke-width="2" fill="none" marker-end="url(#arrowSmall)"/>
    <text x="60" y="8" text-anchor="middle" font-size="10" fill="#6B4423">halt here</text>
    <!-- sidepass arrows -->
    <path d="M 30 55 L 90 55" stroke="#B8860B" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)" marker-start="url(#arrowGoldStart)"/>
    <text x="60" y="75" text-anchor="middle" font-size="10" fill="#B8860B" font-weight="bold">side-pass</text>
    <!-- label -->
    <circle cx="-15" cy="45" r="18" fill="#4A2F1A"/>
    <text x="-15" y="51" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">2</text>
    <text x="60" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">SIDE-PASS</text>
    <text x="135" y="20" font-size="11" fill="#6B4423">1 pole</text>
    <text x="135" y="34" font-size="11" fill="#6B4423">12' long</text>
    <text x="135" y="48" font-size="11" fill="#6B4423">3 steps over</text>
  </g>

  <!-- Path 2→3 -->
  <path d="M 540 225 Q 600 230 620 270" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 3: 5-CONE WEAVE ============= -->
  <g transform="translate(620, 280)">
    <!-- 5 cones in a row, 8 ft apart horizontally -->
    <g id="cone1"><polygon points="0,20 -8,38 8,38" fill="#E37B40" stroke="#8B3A0E" stroke-width="1.5"/><rect x="-9" y="36" width="18" height="3" fill="#8B3A0E"/></g>
    <g transform="translate(60,0)"><polygon points="0,20 -8,38 8,38" fill="#E37B40" stroke="#8B3A0E" stroke-width="1.5"/><rect x="-9" y="36" width="18" height="3" fill="#8B3A0E"/></g>
    <g transform="translate(120,0)"><polygon points="0,20 -8,38 8,38" fill="#E37B40" stroke="#8B3A0E" stroke-width="1.5"/><rect x="-9" y="36" width="18" height="3" fill="#8B3A0E"/></g>
    <g transform="translate(180,0)"><polygon points="0,20 -8,38 8,38" fill="#E37B40" stroke="#8B3A0E" stroke-width="1.5"/><rect x="-9" y="36" width="18" height="3" fill="#8B3A0E"/></g>
    <g transform="translate(240,0)"><polygon points="0,20 -8,38 8,38" fill="#E37B40" stroke="#8B3A0E" stroke-width="1.5"/><rect x="-9" y="36" width="18" height="3" fill="#8B3A0E"/></g>
    <!-- weave path -->
    <path d="M -20 30 Q 0 50 30 30 Q 60 10 90 30 Q 120 50 150 30 Q 180 10 210 30 Q 240 50 260 30" stroke="#B8860B" stroke-width="2.5" fill="none" stroke-dasharray="5 3"/>
    <!-- label -->
    <circle cx="-30" cy="0" r="18" fill="#4A2F1A"/>
    <text x="-30" y="6" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">3</text>
    <text x="120" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">CONE WEAVE (one-handed)</text>
    <text x="120" y="60" text-anchor="middle" font-size="11" fill="#6B4423">5 cones · 8' apart</text>
  </g>

  <!-- Path 3→4 -->
  <path d="M 900 320 Q 920 380 900 430" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 4: GATE ============= -->
  <g transform="translate(700, 430)">
    <!-- gate posts -->
    <rect x="0" y="0" width="8" height="50" fill="#6B4423"/>
    <rect x="180" y="0" width="8" height="50" fill="#6B4423"/>
    <!-- gate (closed position) -->
    <line x1="8" y1="25" x2="180" y2="25" stroke="#6B4423" stroke-width="4"/>
    <!-- gate latch indicator -->
    <circle cx="180" cy="25" r="5" fill="#B8860B" stroke="#6B4423" stroke-width="1.5"/>
    <!-- approach arrow -->
    <path d="M 95 -15 L 95 0" stroke="#7A8A5E" stroke-width="2" fill="none" marker-end="url(#arrowSmall)"/>
    <text x="95" y="-20" text-anchor="middle" font-size="10" fill="#6B4423">side-pass parallel</text>
    <!-- through arrow -->
    <path d="M 95 30 L 95 55" stroke="#B8860B" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
    <text x="95" y="68" text-anchor="middle" font-size="10" fill="#B8860B" font-weight="bold">walk through, halt, close</text>
    <!-- label -->
    <circle cx="-25" cy="25" r="18" fill="#4A2F1A"/>
    <text x="-25" y="31" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">4</text>
    <text x="95" y="-35" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">GATE</text>
    <text x="200" y="15" font-size="11" fill="#6B4423">10-12' wide</text>
    <text x="200" y="29" font-size="11" fill="#6B4423">real gate or</text>
    <text x="200" y="43" font-size="11" fill="#6B4423">rope between cones</text>
  </g>

  <!-- Path 4→5 -->
  <path d="M 700 500 Q 600 520 540 520" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 5: TARP ============= -->
  <g transform="translate(380, 480)">
    <!-- tarp -->
    <rect x="0" y="0" width="120" height="80" fill="#7B8FA1" stroke="#4A5862" stroke-width="2" opacity="0.85"/>
    <!-- tarp texture lines -->
    <line x1="0" y1="20" x2="120" y2="20" stroke="#4A5862" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#4A5862" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#4A5862" stroke-width="0.5" opacity="0.4"/>
    <!-- approach -->
    <path d="M 140 40 L 125 40" stroke="#B8860B" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
    <!-- label -->
    <circle cx="-25" cy="40" r="18" fill="#4A2F1A"/>
    <text x="-25" y="46" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">5</text>
    <text x="60" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">WALK OVER TARP</text>
    <text x="60" y="95" text-anchor="middle" font-size="11" fill="#6B4423">6' × 8' tarp · weighed at corners</text>
  </g>

  <!-- Path 5→6 -->
  <path d="M 380 520 Q 320 540 280 555" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 6: BACK THROUGH L ============= -->
  <g transform="translate(120, 460)">
    <!-- L shape: 4 poles forming an L -->
    <!-- right side of L going up (north) -->
    <rect x="60" y="0" width="10" height="100" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- left side of L going up -->
    <rect x="0" y="0" width="10" height="100" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- bottom-right going east -->
    <rect x="60" y="90" width="100" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- bottom-left going east (offset) -->
    <rect x="0" y="150" width="100" height="10" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- left side bottom going down -->
    <rect x="0" y="100" width="10" height="60" fill="#C9A36A" stroke="#8B6914" stroke-width="1.5"/>
    <!-- back-up path -->
    <path d="M 130 130 L 70 130 L 35 130 L 35 50 L 35 5" stroke="#B8860B" stroke-width="2.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrowGold)"/>
    <text x="100" y="118" font-size="10" fill="#B8860B" font-weight="bold">back up ←</text>
    <!-- label -->
    <circle cx="-25" cy="80" r="18" fill="#4A2F1A"/>
    <text x="-25" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#F5EDD8">6</text>
    <text x="80" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">BACK THROUGH L</text>
    <text x="170" y="100" font-size="11" fill="#6B4423">aisle width</text>
    <text x="170" y="114" font-size="11" fill="#6B4423">4' minimum</text>
  </g>

  <!-- Path 6→7 -->
  <path d="M 155 470 Q 200 400 350 380" stroke="#7A8A5E" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============= STATION 7: HALT + BOW ============= -->
  <g transform="translate(380, 340)">
    <!-- finish star -->
    <polygon points="40,0 49,28 78,28 54,45 63,73 40,56 17,73 26,45 2,28 31,28" fill="#B8860B" stroke="#8B6914" stroke-width="2"/>
    <text x="40" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A2F1A">7</text>
    <text x="40" y="-10" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A2F1A">HALT · COUNT TO 10 · BOW</text>
    <text x="40" y="90" text-anchor="middle" font-size="11" fill="#6B4423" font-style="italic">"Pat the horse. Smile."</text>
  </g>

  <!-- Legend box -->
  <g transform="translate(60, 650)">
    <rect x="0" y="0" width="880" height="80" fill="#F5EDD8" stroke="#4A2F1A" stroke-width="2" rx="4"/>
    <text x="20" y="22" font-size="13" font-weight="bold" fill="#4A2F1A">LEGEND</text>
    <!-- pole -->
    <rect x="80" y="14" width="30" height="8" fill="#C9A36A" stroke="#8B6914"/>
    <text x="120" y="22" font-size="11" fill="#4A2F1A">Ground pole (8-10')</text>
    <!-- cone -->
    <polygon points="245,22 240,14 250,14" fill="#E37B40" stroke="#8B3A0E"/>
    <text x="260" y="22" font-size="11" fill="#4A2F1A">Traffic cone</text>
    <!-- tarp -->
    <rect x="345" y="14" width="20" height="10" fill="#7B8FA1" stroke="#4A5862"/>
    <text x="370" y="22" font-size="11" fill="#4A2F1A">Tarp · weighted corners</text>
    <!-- gate post -->
    <rect x="510" y="12" width="4" height="14" fill="#6B4423"/>
    <rect x="528" y="12" width="4" height="14" fill="#6B4423"/>
    <line x1="514" y1="19" x2="528" y2="19" stroke="#6B4423" stroke-width="2"/>
    <text x="545" y="22" font-size="11" fill="#4A2F1A">Gate (10-12' wide)</text>
    <!-- path arrow forward -->
    <line x1="680" y1="19" x2="715" y2="19" stroke="#7A8A5E" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="725" y="22" font-size="11" fill="#4A2F1A">Forward path</text>
    <!-- backup arrow -->
    <line x1="80" y1="55" x2="115" y2="55" stroke="#B8860B" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="125" y="58" font-size="11" fill="#4A2F1A">Active movement (side-pass, back, weave, walk over)</text>
  </g>

  <!-- footer -->
  <text x="500" y="745" text-anchor="middle" font-size="10" fill="#6B4423" font-style="italic">
    Week 11 graduation course · ride at walk first, then jog · film it · save it
  </text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8A5E"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8A5E"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
    <marker id="arrowGoldStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#B8860B"/>
    </marker>
  </defs>
</svg>
